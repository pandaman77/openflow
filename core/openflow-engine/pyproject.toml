[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openflow-engine"
version = "0.2.1"
description = "Local speech-to-polished-text engine for OpenFlow (sidecar process)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0.0",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "onnx-asr[cpu,hub]>=0.12",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
smart = ["llama-cpp-python>=0.2.90"]

[tool.setuptools.packages.find]
include = ["openflow_engine*"]

[tool.pytest.ini_options]
testpaths = ["../../tests/python"]
