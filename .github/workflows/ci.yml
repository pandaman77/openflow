name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install engine
        run: pip install -e "core/openflow-engine[dev]"
      - name: Unit tests
        run: pytest tests/python -q
      - name: Selftest (offline pipeline)
        run: python -m openflow_engine --selftest
        env:
          PYTHONIOENCODING: utf-8

  frontend-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/desktop
      - name: Typecheck + build
        run: npm run build
        working-directory: apps/desktop

  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Build placeholder frontend dist
        run: New-Item -ItemType Directory -Force apps/desktop/dist; Set-Content apps/desktop/dist/index.html "<html></html>"
        shell: pwsh
      - name: cargo check
        run: cargo check --locked || cargo check
        working-directory: apps/desktop/src-tauri
      - name: cargo fmt
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
        continue-on-error: true
      - name: cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: apps/desktop/src-tauri
        continue-on-error: true
